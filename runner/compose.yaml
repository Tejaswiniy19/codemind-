services:
  runner:
    build:
      context: .
    restart: unless-stopped
    environment:
      CODEMIND_RUNNER_DATA_DIR: /data
      CODEMIND_RUNNER_TOKEN: ${CODEMIND_RUNNER_TOKEN:?set a random runner token in runner/.env}
      CODEMIND_DEPLOYMENT_DOMAINS: ${CODEMIND_DEPLOYMENT_DOMAINS:-apps.example.com}
      CODEMIND_SANDBOX_BACKEND: ${CODEMIND_SANDBOX_BACKEND:?install a reviewed sandbox backend first}
      PYTHONPATH: /opt/sandbox-backend
    volumes:
      - runner-data:/data
      - ./sandbox_backend:/opt/sandbox-backend:ro
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  runner-data:
